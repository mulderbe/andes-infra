name: Terraform plan (PR)

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write   # pedir el token OIDC para entrar a Azure
  contents: read    # leer el código del repo

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.5"   # pon la de tu PC
          terraform_wrapper: false

      - name: Revisar formato
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validar
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Publicar el plan en el resumen
        run: |
          echo "## Plan de Terraform" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
